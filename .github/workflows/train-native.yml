name: Ron-0 Native Model Training

on:
  push:
    branches: [main]
    paths:
      - "ron/model.py"
      - "ron/model_config.py"
      - "ron/training.py"
      - "ron/native_provider.py"
      - "training/seed_corpus.txt"
      - "scripts/train_native.py"
      - "scripts/surprise_eval.py"
      - "tests/test_surprise_eval.py"
      - "tests/test_core_answers.py"
      - "tests/test_native_checkpoint_runtime.py"
      - ".github/workflows/train-native.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ron-native-model-training
  cancel-in-progress: false

jobs:
  train-native-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Ron-0
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install native model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.6" pytest
      - name: Run all Ron regression tests before training
        run: python scripts/run_all_tests.py
      - name: Train Ron-0 native baseline
        run: python -m scripts.train_native
      - name: Place trained weights inside Ron-0 core
        run: |
          mkdir -p ron/checkpoints
          cp artifacts/native-baseline/ron_native_baseline.pt ron/checkpoints/ron_native_baseline.pt
          cp artifacts/native-baseline/metrics.json ron/checkpoints/metrics.json
      - name: Run blind surprise evaluation outside training data
        run: python -m scripts.surprise_eval --output artifacts/native-baseline/surprise-eval.json
      - name: Record training attempt and gate outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          metrics = json.loads(Path("artifacts/native-baseline/metrics.json").read_text(encoding="utf-8"))
          evaluation = json.loads(Path("artifacts/native-baseline/surprise-eval.json").read_text(encoding="utf-8"))
          promoted = bool(evaluation.get("quality_gate_passed"))
          report = {
              "attempt_status": "completed",
              "checkpoint_promoted": promoted,
              "promotion_reason": "strict_answer_quality_gate_passed" if promoted else "strict_answer_quality_gate_failed",
              "metrics": metrics,
              "evaluation": evaluation,
          }
          Path("ron/checkpoints/latest_training_attempt.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if python -c 'import json,sys; r=json.load(open("ron/checkpoints/latest_training_attempt.json", encoding="utf-8")); sys.exit(0 if r.get("checkpoint_promoted") else 1)'; then
            git add ron/checkpoints/ron_native_baseline.pt ron/checkpoints/metrics.json ron/checkpoints/latest_training_attempt.json
            commit_message="Promote validated Ron-0 native checkpoint"
          else
            # Keep the previously approved checkpoint and metrics; record only this failed attempt.
            git restore --source=HEAD -- ron/checkpoints/ron_native_baseline.pt ron/checkpoints/metrics.json
            git add ron/checkpoints/latest_training_attempt.json
            commit_message="Record Ron-0 native training attempt (checkpoint not promoted)"
            echo "::warning::Strict answer-quality gate failed; candidate weights were not promoted."
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$commit_message"
            # Other reviewed changes may reach main while this CPU training job runs.
            git fetch origin main
            git rebase --autostash origin/main
            git push origin HEAD:main
          fi
      - name: Archive training run and surprise evaluation
        uses: actions/upload-artifact@v6
        with:
          name: ron0-native-baseline
          path: artifacts/native-baseline/
          if-no-files-found: error
          retention-days: 14
