name: Ron-0 Native Model Training

on:
  push:
    branches: [main]
    paths:
      - "ron/model.py"
      - "ron/model_config.py"
      - "training/**"
      - "scripts/train_native.py"
      - ".github/workflows/train-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-native-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Ron-0
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install native model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.6" pytest
      - name: Run existing native-model tests
        run: python -m pytest tests/test_model.py tests/test_distillation.py
      - name: Train Ron-0 native baseline
        run: python scripts/train_native.py
      - name: Upload checkpoint and metrics
        uses: actions/upload-artifact@v6
        with:
          name: ron0-native-baseline
          path: artifacts/native-baseline/
          if-no-files-found: error
          retention-days: 14
