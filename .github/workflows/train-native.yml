name: Ron-0 Native Model Training

on:
  push:
    branches: [main]
    paths:
      - "ron/model.py"
      - "ron/model_config.py"
      - "ron/training.py"
      - "training/seed_corpus.txt"
      - "scripts/train_native.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ron-native-model-training
  cancel-in-progress: false

jobs:
  train-native-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Ron-0
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install native model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.6" pytest
      - name: Run native-model tests
        run: python -m pytest tests/test_model.py tests/test_distillation.py tests/test_training.py tests/test_core.py tests/test_surprise_eval.py
      - name: Train Ron-0 native baseline
        run: python -m scripts.train_native
      - name: Place trained weights inside Ron-0 core
        run: |
          mkdir -p ron/checkpoints
          cp artifacts/native-baseline/ron_native_baseline.pt ron/checkpoints/ron_native_baseline.pt
          cp artifacts/native-baseline/metrics.json ron/checkpoints/metrics.json
      - name: Run blind surprise evaluation outside training data
        run: python -m scripts.surprise_eval --output artifacts/native-baseline/surprise-eval.json
      - name: Commit trained weights and metrics to Ron-0
        run: |
          if python -c 'import json,sys; r=json.load(open("artifacts/native-baseline/surprise-eval.json", encoding="utf-8")); sys.exit(0 if r.get("anti_degeneration_gate_passed") else 1)'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ron/checkpoints/ron_native_baseline.pt ron/checkpoints/metrics.json
            if ! git diff --cached --quiet; then
              git commit -m "Add validated Ron-0 native checkpoint"
              # Other reviewed changes may reach main while this CPU training job runs.
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          else
            echo "::warning::Anti-degeneration gate failed; trained weights remain an artifact candidate and were not promoted."
          fi
      - name: Archive training run and surprise evaluation
        uses: actions/upload-artifact@v6
        with:
          name: ron0-native-baseline
          path: artifacts/native-baseline/
          if-no-files-found: error
          retention-days: 14
