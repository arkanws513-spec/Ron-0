name: Train Ron-10M (manual)

on:
  push:
    branches: [feat/native-core-audit, fix/native-generation-and-retrain]
    paths:
      - 'scripts/train_native_10m.py'
      - 'scripts/prepare_corpus.py'
      - 'scripts/download_english_corpus.py'
      - 'scripts/download_oasst1_english.py'
      - 'scripts/train_sft_10m.py'
      - 'training/arabic_sft_seed.txt'
      - 'tests/test_sft_10m.py'
      - 'scripts/evaluate_native_checkpoint.py'
      - 'scripts/promote_native_checkpoint.py'
      - 'training/eval_cases.json'
      - '.github/workflows/train-ron-10m.yml'
      - 'ron/model.py'
      - 'ron/native_provider.py'
      - 'ron/generation_quality.py'
      - 'ron/model_config.py'
  workflow_dispatch:
    inputs:
      training_steps:
        description: Number of optimizer steps for this experiment
        required: true
        default: "5000"
        type: string
      batch_size:
        description: Training batch size (lower if memory is limited)
        required: true
        default: "2"
        type: string
      sft_steps:
        description: Assistant-only supervised fine-tuning steps
        required: true
        default: "5000"
        type: string

concurrency:
  group: ron-10m-training-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the reviewed branch
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install model and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[model]" pytest
      - name: Download English public-domain starter texts
        run: python scripts/download_english_corpus.py
      - name: Download reviewed English dialogue dataset
        run: python scripts/download_oasst1_english.py
      - name: Normalize and deduplicate pretraining corpus
        run: python scripts/prepare_corpus.py
      - name: Run the complete repository test suite before training
        run: python -m pytest
      - name: Train Ron-10M
        env:
          RON_STEPS: ${{ inputs.training_steps || '5000' }}
          RON_BATCH_SIZE: ${{ inputs.batch_size || '2' }}
          RON_SEQUENCE_LENGTH: "256"
        run: python scripts/train_native_10m.py
      - name: Fine-tune Ron on reviewed conversations (English + Arabic)
        env:
          RON_SFT_STEPS: ${{ inputs.sft_steps || '5000' }}
          RON_SFT_BATCH_SIZE: ${{ inputs.batch_size || '2' }}
          RON_SFT_SEQUENCE_LENGTH: "256"
          RON_ARABIC_BATCH_FRACTION: "0.65"
        run: python scripts/train_sft_10m.py
      - name: Blind conversational evaluation
        id: conversation_eval
        continue-on-error: true
        run: >-
          python scripts/evaluate_native_checkpoint.py
          --checkpoint artifacts/native-10m/ron_native_10m_sft.pt
          --cases training/eval_cases.json
          --report artifacts/native-10m/conversational_eval.json
          --min-pass-rate 0.70
      - name: Promote only after all quality gates pass
        id: promote_checkpoint
        if: steps.conversation_eval.outcome == 'success'
        continue-on-error: true
        run: >-
          python scripts/promote_native_checkpoint.py
          --candidate artifacts/native-10m/ron_native_10m_sft.pt
          --report artifacts/native-10m/conversational_eval.json
          --metrics artifacts/native-10m/sft_metrics.json
      - name: Archive model, metrics, and dataset manifests
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ron-10m-training-${{ github.run_id }}
          path: |
            artifacts/native-10m/ron_native_10m.pt
            artifacts/native-10m/metrics.json
            artifacts/native-10m/ron_native_10m_sft.pt
            artifacts/native-10m/sft_metrics.json
            artifacts/native-10m/conversational_eval.json
            ron/checkpoints/ron_native_10m.pt
            training/corpus_manifest.json
            training/gutenberg_sources.json
            training/oasst1_manifest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Fail run if conversational quality gate did not pass
        if: always()
        env:
          EVAL_OUTCOME: ${{ steps.conversation_eval.outcome }}
          PROMOTE_OUTCOME: ${{ steps.promote_checkpoint.outcome }}
        run: |
          test "$EVAL_OUTCOME" = "success" || { echo "Blind conversational evaluation failed; checkpoint was not promoted."; exit 1; }
          test "$PROMOTE_OUTCOME" = "success" || { echo "Checkpoint promotion gate failed; live checkpoint was preserved."; exit 1; }
