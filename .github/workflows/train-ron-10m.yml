name: Train Ron-10M (manual)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/train_native_10m.py'
      - 'scripts/prepare_corpus.py'
      - 'scripts/download_english_corpus.py'
      - 'scripts/download_oasst1_english.py'
      - 'scripts/train_sft_10m.py'
      - 'training/arabic_sft_seed.txt'
      - 'tests/test_sft_10m.py'
      - 'scripts/evaluate_native_checkpoint.py'
      - 'scripts/promote_native_checkpoint.py'
      - 'training/eval_cases.json'
      - '.github/workflows/train-ron-10m.yml'
      - 'ron/model.py'
      - 'ron/native_provider.py'
      - 'ron/generation_quality.py'
      - 'ron/model_config.py'
  # One bounded automatic training run per week. The run number increases the
  # curriculum depth gradually without creating an unbounded self-trigger loop.
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      training_steps:
        description: Number of optimizer steps for this experiment
        required: true
        default: "6000"
        type: string
      batch_size:
        description: Training batch size (lower if memory is limited)
        required: true
        default: "2"
        type: string
      sft_steps:
        description: Assistant-only supervised fine-tuning steps
        required: true
        default: "5000"
        type: string

concurrency:
  group: ron-10m-training-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the reviewed branch
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # Persist the last promoted native weights between disposable GitHub runners.
      # A unique key lets each successful promotion publish a new immutable cache.
      - name: Restore last promoted Ron checkpoint
        id: ron_checkpoint_cache
        uses: actions/cache/restore@v4
        with:
          path: ron/checkpoints/ron_native_10m.pt
          key: ron-live-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ron-live-checkpoint-
      # Release assets are durable; Actions caches are only a performance optimization.
      # Fall back to the latest promoted checkpoint when the cache was evicted.
      - name: Restore durable promoted checkpoint if cache is empty
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f ron/checkpoints/ron_native_10m.pt ]; then
            mkdir -p ron/checkpoints
            gh release download ron-live-checkpoint --repo "$GITHUB_REPOSITORY" \
              --pattern ron_native_10m.pt --dir ron/checkpoints || true
          fi
      # If no quality-approved live checkpoint exists yet, continue experimental learning
      # from the last failed candidate. This file is training-only and never served live.
      - name: Restore prior experimental continuation if no promoted checkpoint exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f ron/checkpoints/ron_native_10m.pt ]; then
            mkdir -p ron/checkpoints
            gh release download ron-training-continuation --repo "$GITHUB_REPOSITORY" \
              --pattern ron_training_continuation.pt --dir ron/checkpoints || true
            if [ -f ron/checkpoints/ron_training_continuation.pt ]; then
              mv ron/checkpoints/ron_training_continuation.pt ron/checkpoints/ron_native_10m.pt
              echo "Restored last experimental checkpoint for training only; live weights remain unchanged."
            fi
          fi
      - name: Report checkpoint starting point and progressive difficulty
        env:
          RON_STEPS: ${{ inputs.training_steps || (github.run_number < 3 && '6000' || github.run_number < 5 && '7000' || github.run_number < 7 && '8000' || '9000') }}
          RON_SFT_STEPS: ${{ inputs.sft_steps || (github.run_number < 3 && '6000' || github.run_number < 5 && '7000' || github.run_number < 7 && '8000' || '9000') }}
        run: |
          echo "Training progression: run_number=$GITHUB_RUN_NUMBER base_steps=$RON_STEPS sft_steps=$RON_SFT_STEPS"
          if [ -f ron/checkpoints/ron_native_10m.pt ]; then
            echo "Continuing from a checkpoint; this file is training-only until all quality gates pass."
            ls -lh ron/checkpoints/ron_native_10m.pt
          else
            echo "No previous checkpoint found; initializing a new experimental run."
          fi
      - name: Install model and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[model]" pytest
      - name: Download English public-domain starter texts
        run: python scripts/download_english_corpus.py
      - name: Download reviewed English dialogue dataset
        run: python scripts/download_oasst1_english.py
      - name: Normalize and deduplicate pretraining corpus
        run: python scripts/prepare_corpus.py
      - name: Run the complete repository test suite before training
        run: python -m pytest
      - name: Train Ron-10M
        env:
          # Progressive schedule: 6k, 7k, 8k, then 9k steps; cap to protect runner limits.
          RON_STEPS: ${{ inputs.training_steps || (github.run_number < 3 && '6000' || github.run_number < 5 && '7000' || github.run_number < 7 && '8000' || '9000') }}
          RON_BATCH_SIZE: ${{ inputs.batch_size || '2' }}
          RON_SEQUENCE_LENGTH: "256"
        run: python scripts/train_native_10m.py
      - name: Fine-tune Ron on reviewed conversations (English + Arabic)
        env:
          # Increase supervised dialogue practice alongside the base training schedule.
          RON_SFT_STEPS: ${{ inputs.sft_steps || (github.run_number < 3 && '6000' || github.run_number < 5 && '7000' || github.run_number < 7 && '8000' || '9000') }}
          RON_SFT_BATCH_SIZE: ${{ inputs.batch_size || '2' }}
          RON_SFT_SEQUENCE_LENGTH: "256"
          RON_ARABIC_BATCH_FRACTION: "0.65"
        run: python scripts/train_sft_10m.py
      - name: Blind conversational evaluation
        id: conversation_eval
        continue-on-error: true
        run: >-
          python scripts/evaluate_native_checkpoint.py
          --checkpoint artifacts/native-10m/ron_native_10m_sft.pt
          --cases training/eval_cases.json
          --report artifacts/native-10m/conversational_eval.json
          --min-pass-rate 0.80
          --expected-case-count 300
      - name: Promote only after all quality gates pass
        id: promote_checkpoint
        if: steps.conversation_eval.outcome == 'success'
        continue-on-error: true
        run: >-
          python scripts/promote_native_checkpoint.py
          --candidate artifacts/native-10m/ron_native_10m_sft.pt
          --report artifacts/native-10m/conversational_eval.json
          --metrics artifacts/native-10m/sft_metrics.json
      # Save only after evaluation AND promotion both succeed. Failed candidates never
      # replace the durable checkpoint used by the next training run.
      - name: Persist newly promoted Ron checkpoint in durable release
        if: steps.conversation_eval.outcome == 'success' && steps.promote_checkpoint.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view ron-live-checkpoint --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create ron-live-checkpoint --repo "$GITHUB_REPOSITORY" \
              --title "Ron live native checkpoint" \
              --notes "Automatically updated only when training and evaluation gates pass. Asset: ron_native_10m.pt"
          fi
          gh release upload ron-live-checkpoint ron/checkpoints/ron_native_10m.pt \
            --repo "$GITHUB_REPOSITORY" --clobber
      - name: Cache newly promoted checkpoint for faster next run
        if: steps.conversation_eval.outcome == 'success' && steps.promote_checkpoint.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ron/checkpoints/ron_native_10m.pt
          key: ron-live-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
      # Preserve the latest experiment for the next run without promoting it to live.
      # The approved ron-live-checkpoint release is only updated after all gates pass.
      - name: Persist experimental continuation for the next training run
        if: always() && steps.conversation_eval.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f artifacts/native-10m/ron_native_10m_sft.pt ]; then
            cp artifacts/native-10m/ron_native_10m_sft.pt ron_training_continuation.pt
            if ! gh release view ron-training-continuation --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create ron-training-continuation --repo "$GITHUB_REPOSITORY" \
                --title "Ron experimental training continuation" \
                --notes "Training-only checkpoint for subsequent experiments. Never used as live weights unless it passes the separate quality gate."
            fi
            gh release upload ron-training-continuation ron_training_continuation.pt \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "No SFT candidate exists; preserving all previous checkpoints."
          fi
      - name: Archive model, metrics, and dataset manifests
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ron-10m-training-${{ github.run_id }}
          path: |
            artifacts/native-10m/ron_native_10m.pt
            artifacts/native-10m/metrics.json
            artifacts/native-10m/ron_native_10m_sft.pt
            artifacts/native-10m/sft_metrics.json
            artifacts/native-10m/conversational_eval.json
            ron/checkpoints/ron_native_10m.pt
            training/corpus_manifest.json
            training/gutenberg_sources.json
            training/oasst1_manifest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Fail run if conversational quality gate did not pass
        if: always()
        env:
          EVAL_OUTCOME: ${{ steps.conversation_eval.outcome }}
          PROMOTE_OUTCOME: ${{ steps.promote_checkpoint.outcome }}
        run: |
          test "$EVAL_OUTCOME" = "success" || { echo "Blind conversational evaluation failed; checkpoint was not promoted."; exit 1; }
          test "$PROMOTE_OUTCOME" = "success" || { echo "Checkpoint promotion gate failed; live checkpoint was preserved."; exit 1; }
