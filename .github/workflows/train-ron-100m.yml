name: Ron 100M free training proof

on:
  push:
    branches: [main]
    paths:
      - "ron/scale_presets.py"
      - "scripts/pretrain_scalable_ron.py"
      - "scripts/train_ron_tokenizer.py"
      - "training/seed_corpus.txt"
      - "tests/test_scalable_model.py"
      - ".github/workflows/train-ron-100m.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-100m:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out Ron
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install native training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[model]" tokenizers pytest
      - name: Run all Ron regression tests before training
        run: python scripts/run_all_tests.py
      - name: Build tokenizer from Ron's starter corpus
        run: |
          python scripts/train_ron_tokenizer.py --corpus training/seed_corpus.txt --output artifacts/ron-tokenizer --vocab-size 8000 --min-frequency 1
      - name: Run actual 100M-parameter CPU training
        run: |
          python scripts/pretrain_scalable_ron.py \
            --corpus training/seed_corpus.txt \
            --tokenizer artifacts/ron-tokenizer/tokenizer.json \
            --output artifacts/ron-100m-free-proof \
            --scale-preset ron-100m \
            --sequence-length 32 \
            --batch-size 1 \
            --epochs 1 \
            --max-steps 3 \
            --learning-rate 0.00001
      - name: Verify checkpoint and training metrics
        run: |
          python - <<'PY'
          import json, pathlib, torch
          root = pathlib.Path("artifacts/ron-100m-free-proof")
          metrics = json.loads((root / "metrics.json").read_text())
          checkpoint = torch.load(root / "checkpoint.pt", map_location="cpu", weights_only=True)
          assert metrics["parameters"] == 99_959_808, metrics
          assert sum(row["steps"] for row in metrics["history"]) == 3, metrics
          assert all(row["train_loss"] > 0 for row in metrics["history"]), metrics
          assert "model" in checkpoint and "config" in checkpoint
          print(json.dumps({"status": metrics["status"], "parameters": metrics["parameters"], "steps": sum(row["steps"] for row in metrics["history"]), "history": metrics["history"], "elapsed_seconds": metrics["elapsed_seconds"]}, indent=2))
          PY
      - name: Upload trained checkpoint and metrics
        uses: actions/upload-artifact@v4
        with:
          name: ron-100m-free-training-proof
          path: |
            artifacts/ron-100m-free-proof/checkpoint.pt
            artifacts/ron-100m-free-proof/config.json
            artifacts/ron-100m-free-proof/tokenizer.json
            artifacts/ron-100m-free-proof/metrics.json
          if-no-files-found: error
          retention-days: 30
