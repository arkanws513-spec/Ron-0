name: Ron Qwen LoRA Training

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Maximum training steps"
        required: true
        default: "500"
        type: string
      evaluate:
        description: "Run blind bilingual evaluation after training"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ron-qwen-lora-training
  cancel-in-progress: false

jobs:
  train:
    # Requires a GPU runner registered to this repository with these labels.
    # Standard GitHub-hosted ubuntu-latest runners do not provide a CUDA GPU.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out training branch
        uses: actions/checkout@v4

      - name: Verify Python and CUDA GPU
        shell: bash
        run: |
          python --version
          python - <<'PY'
          import sys
          if sys.version_info < (3, 11) or sys.version_info >= (3, 13):
              raise SystemExit("Training requires Python 3.11 or 3.12.")
          try:
              import torch
          except ImportError:
              raise SystemExit("PyTorch is not installed on the GPU runner. Install the CUDA-enabled PyTorch build first.")
          print("PyTorch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          if not torch.cuda.is_available():
              raise SystemExit("No CUDA GPU detected. Refusing to run real training on CPU.")
          print("GPU:", torch.cuda.get_device_name(0))
          print("GPU memory GiB:", round(torch.cuda.get_device_properties(0).total_memory / 1024**3, 2))
          PY
          nvidia-smi

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-training.txt

      - name: Download and prepare bilingual dialogue data
        run: python scripts/download_oasst1_english.py

      - name: Train experimental LoRA adapter
        shell: bash
        run: |
          STEPS="${{ inputs.steps }}"
          if ! [[ "$STEPS" =~ ^[1-9][0-9]*$ ]]; then
            echo "steps must be a positive integer" >&2
            exit 2
          fi
          python scripts/train_qwen_lora.py \
            --model Qwen/Qwen2.5-0.5B-Instruct \
            --output artifacts/qwen-lora-candidate \
            --steps "$STEPS" \
            --batch-size 1 \
            --gradient-accumulation 8 \
            --max-sequence-length 512 \
            --eval-every 50

      - name: Blind bilingual evaluation
        if: ${{ inputs.evaluate }}
        run: |
          python scripts/evaluate_qwen_lora.py \
            --base-model Qwen/Qwen2.5-0.5B-Instruct \
            --adapter artifacts/qwen-lora-candidate/adapter \
            --cases training/qwen_eval_cases.json \
            --report artifacts/qwen-lora-candidate/evaluation.json \
            --min-pass-rate 0.80 \
            --min-language-pass-rate 0.80

      - name: Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ron-qwen-lora-candidate-${{ github.run_id }}
          path: |
            artifacts/qwen-lora-candidate/
            training/oasst1_manifest.json
          if-no-files-found: warn
          retention-days: 30
