name: Publish requested Ron checkpoint to live runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-requested-ron-checkpoint.yml'
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ron-requested-live-checkpoint
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download the exact requested training checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ron-weights
          gh release download ron-training-continuation \
            --repo "$GITHUB_REPOSITORY" \
            --pattern ron_training_continuation.pt \
            --dir /tmp/ron-weights
          test -s /tmp/ron-weights/ron_training_continuation.pt
          sha256sum /tmp/ron-weights/ron_training_continuation.pt
          cp /tmp/ron-weights/ron_training_continuation.pt /tmp/ron-weights/ron_native_10m.pt
      - name: Publish as the checkpoint consumed by the native runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view ron-live-checkpoint --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create ron-live-checkpoint --repo "$GITHUB_REPOSITORY" \
              --title "Ron live native checkpoint" \
              --notes "Checkpoint explicitly requested for live activation. This checkpoint did not pass the blind conversational quality gate; monitor runtime quality and roll back if needed."
          fi
          gh release upload ron-live-checkpoint /tmp/ron-weights/ron_native_10m.pt \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release view ron-live-checkpoint --repo "$GITHUB_REPOSITORY"
