name: Ron Single Runtime CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check frontend syntax
        run: node --check app.js
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Test the single inference path
        run: python -m pytest tests/test_contracts.py tests/test_llm_provider.py
