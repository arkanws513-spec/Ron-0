name: Ron CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[model]" pytest
      - name: Run tests
        run: python -m pytest
      - name: Validate browser JavaScript
        run: node --check app.js
      - name: Smoke-test browser runtime
        run: node --test tests/test_frontend_runtime.mjs tests/test_reasoner_runtime.mjs
      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/architecture.md
          test -f index.html
          test -f app.js
          test -f assets/style.css
          test -d ron
          test -d tests
