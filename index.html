<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="رون — مساعد ذكاء اصطناعي مستقل"><meta name="theme-color" content="#080b14">
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/style.css">
<title>رون — Ron</title>
</head>
<body>
<main class="app">
<header class="topbar">
  <div class="brand"><div class="mark">R</div><div><strong>رون</strong><small>المساعد المستقل</small></div></div>
  <div class="actions"><span class="status"><i></i> محلي</span><button id="menu" class="icon" aria-label="الإعدادات">☰</button></div>
</header>
<section id="chat" class="chat" aria-live="polite"></section>
<form id="composer" class="composer">
  <textarea id="input" rows="1" placeholder="اكتب رسالة لرون..." autocomplete="off"></textarea>
  <button id="send" type="submit">إرسال</button>
</form>
<footer>لا توجد مفاتيح API داخل الموقع • الذاكرة محفوظة على جهازك</footer>
</main>
aside id="settings" class="drawer" aria-label="إعدادات رون">
  <div class="drawer-card"><div class="drawer-head"><h2>رون</h2><button id="close-settings" class="icon">×</button></div>
  <button id="new-chat" class="setting">محادثة جديدة</button>
  <button id="export" class="setting">تصدير الذاكرة</button>
  <label class="setting file">استيراد الذاكرة<input id="import" type="file" accept="application/json"></label>
  <button id="clear-data" class="setting danger">مسح بيانات الجهاز</button>
  <p>الحالة: النواة المحلية جاهزة. النموذج المتقدم سيتم توصيله بالنواة لاحقًا دون وضع الأسرار في الواجهة.</p></div>
</aside>
<script src="app.js"></script>
</body></html>
