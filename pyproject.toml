[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ron-0"
version = "0.2.0"
description = "Native model and provider-agnostic foundation for Ron AI assistant"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
model = ["torch>=2.6", "tokenizers>=0.20"]
distill = ["torch>=2.6", "transformers>=4.45", "accelerate>=0.34", "safetensors>=0.4"]
scalable = ["torch>=2.6", "tokenizers>=0.20"]

[tool.setuptools.packages.find]
include = ["ron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
