[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ron-0"
version = "0.3.0"
description = "Ron-0 assistant with a local instruction-tuned Qwen model and llama.cpp inference"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
model = [
  "torch>=2.6",
  "tokenizers>=0.20",
  "llama-cpp-python>=0.3.16",
  "huggingface-hub>=0.25",
]
distill = ["torch>=2.6", "transformers>=4.45", "accelerate>=0.34", "safetensors>=0.4"]
scalable = ["torch>=2.6", "tokenizers>=0.20"]

[tool.setuptools.packages.find]
include = ["ron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
