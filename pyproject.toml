[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ron-0"
version = "0.1.0"
description = "Provider-agnostic foundation for Ron AI assistant"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["ron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
