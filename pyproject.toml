[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ron-0"
version = "0.4.0"
description = "Ron-0 single-runtime assistant using Qwen2.5-0.5B-Instruct and llama.cpp"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
inference = ["llama-cpp-python>=0.3.16", "huggingface-hub>=0.25,<2"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
